name: Modrinth Auto Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/modrinth_publisher.py'
      - '.github/workflows/modrinth-autopublish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modrinth-autopublish
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Verify one-time publishing prerequisites
        id: check
        env:
          ENABLED: ${{ vars.MODRINTH_PUBLISH_ENABLED }}
          DISCLOSURE: ${{ vars.MODRINTH_AI_DISCLOSURE_CONFIRMED }}
        shell: bash
        run: |
          if [[ "$ENABLED" == "true" && "$DISCLOSURE" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing disabled: initial token, disclosure and release verification are prerequisites."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.8', '1.21.11', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit test publisher (offline)
        run: python3 -m unittest discover -s scripts -p 'test_modrinth_publisher.py' -v
      - name: Build Minecraft version
        run: gradle clean build -Pmc_target=${{ matrix.minecraft }} --no-daemon
      - name: Validate distributable JAR
        run: python3 scripts/modrinth_publisher.py --target '${{ matrix.minecraft }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false
      - name: Require Modrinth token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "::error::MODRINTH_TOKEN secret missing. No upload attempted."
            exit 1
          fi
      - name: Publish all four versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PUBLISH_ENABLED: ${{ vars.MODRINTH_PUBLISH_ENABLED }}
          MODRINTH_AI_DISCLOSURE_CONFIRMED: ${{ vars.MODRINTH_AI_DISCLOSURE_CONFIRMED }}
        run: python3 scripts/modrinth_publisher.py --batch-dir release-artifacts --publish
