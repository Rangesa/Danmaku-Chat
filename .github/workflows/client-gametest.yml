name: Minecraft Client GameTest (real launch)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-client-gametest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-client-test:
    name: Minecraft ${{ matrix.minecraft }} client + world + HUD
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.8', '1.21.11', '26.2', '26.3']
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      # Fabric's documented CI workaround for flaky client GameTest network synchronization.
      JAVA_TOOL_OPTIONS: '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Xvfb and Mesa for headless graphical Minecraft
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libxrandr2 libxi6 libxcursor1 libxinerama1 \
            mesa-vulkan-drivers libvulkan1 vulkan-tools libglx-mesa0 mesa-utils
          # Minecraft 26.3 uses RenderPearl (SDL3): expose a software Vulkan
          # driver with the required VK_KHR_surface WSI, instead of the
          # runner's headless Vulkan ICD that cannot present a window.
          lvp="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          if [[ -n "$lvp" ]]; then
            echo "VK_DRIVER_FILES=$lvp" >> "$GITHUB_ENV"
          fi
          echo "SDL_VIDEODRIVER=x11" >> "$GITHUB_ENV"
          echo "XDG_SESSION_TYPE=x11" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          # Prefer native GLX if Minecraft/SDL first attempts OpenGL.
          echo "JAVA_TOOL_OPTIONS=-Dfabric.client.gametest.disableNetworkSynchronizer=true -Dorg.lwjgl.opengl.contextAPI=native" >> "$GITHUB_ENV"
          echo "Available Mesa Vulkan ICDs:"
          ls -1 /usr/share/vulkan/icd.d/
      - name: Launch real Fabric Minecraft client with GameTest
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 600s \
            xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' \
            gradle runClientGameTest \
              -Pmc_target=${{ matrix.minecraft }} \
              -Penable_client_gametests=true \
              --no-daemon --stacktrace --console=plain \
              2>&1 | tee minecraft-client-gametest.log
      - name: Always upload actual game logs, crash reports, screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-client-evidence-${{ matrix.minecraft }}
          path: |
            minecraft-client-gametest.log
            run/**/logs/**
            run/**/crash-reports/**
            run/**/screenshots/**
            build/run/**/logs/**
            build/run/**/crash-reports/**
            build/run/**/screenshots/**
            build/reports/**
            build/test-results/**
          if-no-files-found: warn
          retention-days: 14
