name: Fabric multiversion (compile candidates)
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.8", "1.21.11", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Offline Modrinth publisher unit tests
        run: python3 -m unittest discover -s scripts -p 'test_modrinth_publisher.py' -v
      - name: Compile and test
        run: gradle clean build -Pmc_target=${{ matrix.minecraft }} --no-daemon --stacktrace
      - name: Verify built JAR metadata for Modrinth (dry run)
        run: python3 scripts/modrinth_publisher.py --target ${{ matrix.minecraft }}
      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DanmakuChat-${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
