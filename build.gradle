plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21' apply false
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.2.20' apply false
}

// Separate game-specific JARs: do not claim a single compiled binary works for every Minecraft version.
def targets = [
    '1.21.8' : [mappings:'1.21.8+build.1', fabric:'0.129.0+1.21.8', modmenu:'15.0.2', java:21, modern:false],
    '1.21.11': [mappings:'1.21.11+build.6', fabric:'0.141.6+1.21.11', modmenu:'17.0.0', java:21, modern:false],
    '26.2'   : [fabric:'0.161.0+26.2', modmenu:'20.0.3', java:25, modern:true],
    '26.3'   : [fabric:'0.162.0+26.3', modmenu:'21.0.0', java:25, modern:true]
]
def mcTarget = (findProperty('mc_target') ?: '1.21.8').toString()
if (!targets.containsKey(mcTarget)) {
    throw new GradleException("Unsupported mc_target '${mcTarget}'; choose ${targets.keySet()}")
}
def mc = targets[mcTarget]
apply plugin: mc.modern ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
if (!mc.modern) {
    apply plugin: 'org.jetbrains.kotlin.jvm'
}
version = project.mod_version
group = project.maven_group
base { archivesName = "${project.archives_base_name}-${mcTarget}" }

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${mcTarget}"
    if (mc.modern) {
        // 26.1+ Minecraft binaries are unobfuscated: no mappings dependency or modImplementation.
        implementation "net.fabricmc:fabric-loader:0.19.5"
        implementation "net.fabricmc.fabric-api:fabric-api:${mc.fabric}"
        implementation "com.terraformersmc:modmenu:${mc.modmenu}"
    } else {
        mappings "net.fabricmc:yarn:${mc.mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:0.19.5"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${mc.fabric}"
        modImplementation "com.terraformersmc:modmenu:${mc.modmenu}"
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    }
}
if (mc.modern) {
    sourceSets.main.java.setSrcDirs(['src/modern/java'])
    sourceSets.main.resources.setSrcDirs(['src/modern/resources'])
}
processResources {
    inputs.property 'version', version
    inputs.property 'minecraft_version', mcTarget
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: mcTarget, loader_version: '0.19.5'
    }
    if (mc.modern) {
        // Reuse localization and original icon without copying large binary assets.
        from('src/main/resources') { include 'assets/**' }
    } else if (mcTarget == '1.21.11') {
        // Minecraft 1.21.11 changed ChatHud#render's descriptor; switch the Mixin class.
        filesMatching('danmakuchat.mixins.json') {
            filter { String line -> line.replace('"ChatHudMixin"', '"ChatHudMixin12111"') }
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = mc.java
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(mc.java)
    withSourcesJar()
}
if (!mc.modern) {
    kotlin { jvmToolchain(21) }
}
jar {
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = "${project.archives_base_name}-${mcTarget}"
            from components.java
        }
    }
}


// Opt-in: only real client tests load the Fabric GameTest harness.
// Ordinary build/release JARs stay free of test classes and metadata.
if (providers.gradleProperty('enable_client_gametests').map { it.toBoolean() }.orElse(false).get()) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'danmakuchat-client-gametest'
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }
    sourceSets.gametest.java.setSrcDirs([
        mc.modern ? 'src/gametest/modern/java' : 'src/gametest/legacy/java'
    ])
}
